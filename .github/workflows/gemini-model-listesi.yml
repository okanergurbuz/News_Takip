# Geçici teşhis: aday Gemini modellerine deneme çağrısı yapıp durum/hata döker.
# Doğru model adı belirlendikten sonra bu dosya silinecek.
name: gemini-model-listesi

on:
  workflow_dispatch: {}

jobs:
  listele:
    runs-on: ubuntu-latest
    steps:
      - name: Aday modellere deneme çağrısı yap
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.request, urllib.error

          adaylar = [
              "gemini-2.5-flash-lite",
              "gemini-flash-lite-latest",
              "gemini-2.5-flash",
              "gemini-2.0-flash",
              "gemini-3.1-flash-lite",
          ]
          govde = json.dumps({
              "contents": [{"role": "user", "parts": [{"text": "Tek kelimeyle 'merhaba' de."}]}],
              "generationConfig": {"maxOutputTokens": 1024},
          }).encode()

          for model in adaylar:
              url = f"https://generativelanguage.googleapis.com/v1beta/models/{model}:generateContent"
              istek = urllib.request.Request(url, data=govde, headers={
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"],
                  "content-type": "application/json",
              })
              try:
                  with urllib.request.urlopen(istek, timeout=30) as y:
                      veri = json.load(y)
                      metin = veri.get("candidates", [{}])[0].get("content", {}).get("parts", [{}])[0].get("text", "?")
                      print(f"{model}: 200 OK -> {metin[:60]!r}")
              except urllib.error.HTTPError as h:
                  detay = h.read().decode(errors="replace")[:400]
                  print(f"{model}: HTTP {h.code} -> {detay}")
              except Exception as e:
                  print(f"{model}: HATA {e}")
          EOF
