# Takip edilecek feed'ler. RSS/Atom URL'i.
# category: bültende gruplama için. name: gösterim adı.
# İpucu: kategori adına emoji koyarsanız embed başlığında görünür
# (ör. category: "🔋 EV / Otomotiv").
feeds:
  - name: "The Verge"
    url: "https://www.theverge.com/rss/index.xml"
    category: "Teknoloji"
  - name: "Hacker News (Front Page)"
    url: "https://hnrss.org/frontpage"
    category: "Teknoloji"
  - name: "Otonom Haber"
    url: "https://otonomhaber.com/feed"
    category: "🇹🇷 Türkiye EV / Otomotiv"
  - name: "Google News (elektrikli araç)"
    url: "https://news.google.com/rss/search?q=%22elektrikli%20ara%C3%A7%22&hl=tr&gl=TR&ceid=TR:tr"
    category: "🇹🇷 Türkiye EV / Otomotiv"
  - name: "NTV Otomobil"
    url: "https://www.ntv.com.tr/otomobil.rss"
    category: "🇹🇷 Türkiye EV / Otomotiv"
  - name: "CNN Türk Otomobil"
    url: "https://www.cnnturk.com/feed/rss/otomobil/news"
    category: "🇹🇷 Türkiye EV / Otomotiv"
  - name: "ShiftDelete Otomobil"
    url: "https://shiftdelete.net/otomobil/feed"
    category: "🇹🇷 Türkiye EV / Otomotiv"
  - name: "Next.js Blog"
    url: "https://nextjs.org/feed.xml"
    category: "Geliştirici"

# Süzme
filter:
  lookback_hours: 24           # Son kaç saatteki içerikler alınır
  max_items_total: 40          # Bültende toplam en fazla içerik
  max_per_feed: 8              # Feed başına en fazla içerik

# LLM özet
summary:
  enabled: true                # false ise feed'in kendi özeti kullanılır
  provider: "gemini"           # "gemini" (ücretsiz katman, GEMINI_API_KEY) ya da
                               # "anthropic" (ANTHROPIC_API_KEY)
  model: "gemini-flash-lite-latest"   # her zaman güncel flash-lite'a işaret eden
                                      # takma ad; anthropic için: "claude-haiku-4-5-20251001"
  max_articles: 40             # Maliyet/kota kontrolü: en fazla kaç içeriğe özet çıkarılır
  language: "Türkçe"
  sentences: "2-3"

discord:
  username: "Günlük Bülten"
  embed_color: 2201331         # 0x21C4B3
